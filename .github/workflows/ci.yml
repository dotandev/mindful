name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npx ultracite check
      - name: Tests
        run: npm test
      - name: Type check and build the web app
        run: npm run build
      - name: Type check the Android app
        run: npm run typecheck -w @mindfulverse/mobile
